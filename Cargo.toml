[package]
name = "reflecdith"
version = "0.1.0"
edition = "2024"

[features]
default = []
ros2 = ["dep:rclrs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
urdf-rs = "0.10"
mesh-loader = "0.1.13"
rclrs = { version = "0.7", optional = true }
bytemuck = "1.25.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
env_logger = "0.11.11"
glam = { version = "0.33.7", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
stl_io = "0.11.0"
wgpu = "30.0.1"
winit = "0.30.13"

# The launcher runs development builds. Optimize every dependency, including
# wgpu, its Vulkan layer, glam and the ROS bindings, while retaining debug
# symbols. The first build takes longer; application rebuilds are unaffected.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.reflecdith]
opt-level = 1
